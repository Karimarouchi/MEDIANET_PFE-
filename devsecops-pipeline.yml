name: "🔐 DevSecOps - Full Security Pipeline"

# ─────────────────────────────────────────────────────
# DÉCLENCHEMENT :
#   - push sur main (automatique quand tu pousses du code)
#   - workflow_dispatch (depuis ton app via le bouton "Lancer")
# ─────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Déclenché depuis Medianet App"
        required: false
        default: "manual"

permissions:
  contents: read
  actions: write
  security-events: write

# ─────────────────────────────────────────────────────
# ÉTAPE 1 : SOURCE
# Pourquoi ? Récupérer le code source du repo pour travailler dessus.
# C'est TOUJOURS la première étape de tout pipeline CI/CD.
# ─────────────────────────────────────────────────────
jobs:

  source:
    name: "📥 SOURCE - Récupération du code"
    runs-on: ubuntu-latest
    outputs:
      # Transmet des infos aux étapes suivantes
      commit_sha: ${{ steps.info.outputs.sha }}
      commit_message: ${{ steps.info.outputs.message }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0    # Récupère TOUT l'historique (nécessaire pour Gitleaks)

      - name: Afficher les infos du commit
        id: info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "✅ Code récupéré : $(git rev-parse --short HEAD)"
          echo "📝 Commit : $(git log -1 --pretty=%s)"
          echo "👤 Auteur : $(git log -1 --pretty=%an)"
          echo "📁 Fichiers modifiés : $(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l)"

  # ─────────────────────────────────────────────────────
  # ÉTAPE 2 : BUILD
  # Pourquoi ? Vérifier que le code COMPILE correctement.
  # Si le build échoue → le code est cassé, inutile de continuer.
  # Cache Maven et npm pour éviter 30min de téléchargement à chaque run.
  # ─────────────────────────────────────────────────────
  build:
    name: "🔨 BUILD - Compilation"
    runs-on: ubuntu-latest
    needs: source    # ← Attend que SOURCE soit terminé avant de commencer

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Backend Java ──────────────────────────────
      - name: Installer Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven    # ← Cache Maven = plus jamais 30min de téléchargement !

      - name: Build Backend (Maven)
        run: |
          cd Backend
          echo "🔨 Compilation du backend Java..."
          mvn clean package -DskipTests -q
          echo "✅ Backend compilé avec succès"
          echo "📦 Taille du JAR : $(du -sh target/*.jar 2>/dev/null | cut -f1)"

      # ── Frontend Node.js ──────────────────────────
      - name: Installer Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Frontend (npm)
        run: |
          cd Frontend
          echo "🔨 Compilation du frontend..."
          npm ci --silent
          CI=false npm run build
          echo "✅ Frontend compilé avec succès"
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true

      # ── Sauvegarder les artifacts ─────────────────
      # Pourquoi ? Pour que les étapes suivantes (Docker, Tests)
      # puissent utiliser le JAR compilé sans recompiler
      - name: Sauvegarder les artifacts de build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: |
            Backend/target/*.jar
            Frontend/build/
          retention-days: 1    # Garde 1 jour (suffisant pour le pipeline)

  # ─────────────────────────────────────────────────────
  # ÉTAPE 2.5 : TESTS UNITAIRES
  # Pourquoi ? Vérifier que toutes les fonctionnalités marchent.
  # Si une fonction casse → le test échoue avec son nom exact.
  # Ex: "ClientServiceTest > deleteClient_echoueSiNonAdmin FAILED"
  # ─────────────────────────────────────────────────────
  unit-tests:
    name: "✅ TESTS UNITAIRES - Backend & Frontend"
    runs-on: ubuntu-latest
    needs: build    # ← Attend que le BUILD réussisse avant de tester

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Backend Java — Tests unitaires ────────────────
      - name: Installer Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: "🧪 Tests unitaires Backend (JUnit 5 + Mockito)"
        run: |
          cd Backend
          echo "🧪 Lancement des tests unitaires Java..."
          mvn test \
            -Dtest="UserEntityTest,JwtUtilTest,ClientServiceTest,UserServiceTest,AccessRoleServiceTest,AutoFixServiceTest,SbomParserServiceTest,CiTokenServiceTest,JwtAuthFilterTest,CiScanServiceTest" \
            -DfailIfNoTests=false \
            --no-transfer-progress
          echo "✅ Tous les tests Backend réussis"
        env:
          # Empêche Spring de se connecter à une BDD lors des tests unitaires
          SPRING_DATASOURCE_URL: ""

      - name: "📊 Publier le rapport de tests Backend"
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        if: always()    # Publier même si les tests échouent
        with:
          name: "Backend Unit Tests"
          path: "Backend/target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: true

      # ── Frontend — Tests unitaires ─────────────────────
      - name: Installer Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Installer les dépendances Frontend
        run: |
          cd Frontend
          npm ci --silent

      - name: "🧪 Tests unitaires Frontend (Jest + React Testing Library)"
        run: |
          cd Frontend
          echo "🧪 Lancement des tests unitaires Frontend..."
          npm test -- --watchAll=false --ci --coverage \
            --coverageReporters=text --coverageReporters=lcov
          echo "✅ Tous les tests Frontend réussis"
        env:
          CI: true

      - name: "📊 Publier la couverture Frontend"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          retention-days: 7
