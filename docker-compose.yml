services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medianet_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medianet_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Keep the Kali scanner image tagged AND in-use so `docker image prune`
  # cannot delete it. Scans still `docker run --rm` a separate container via docker.sock.
  kali-scanner:
    image: ${VULNIX_DOCKER_IMAGE:-medianet-kali-scanner:v3}
    build:
      context: ./scanner-image
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kali-scanner:
        condition: service_started
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-medianet_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_API_KEY: ${GEMINI_CHAT_API_KEY:-}
      GEMINI_CHAT_API_URL: ${GEMINI_CHAT_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}
      # IMPORTANT: same absolute path on host AND in container so
      # `docker run -v $resultsDir:...` (via docker.sock) writes where the backend reads.
      VULNIX_RESULTS_BASE_DIR: ${VULNIX_HOST_DATA_DIR:-/opt/vulnix}/scan-results
      VULNIX_DC_CACHE_DIR: ${VULNIX_HOST_DATA_DIR:-/opt/vulnix}/dc-cache
      EXPLOITDB_CSV_PATH: ${VULNIX_HOST_DATA_DIR:-/opt/vulnix}/cache/exploitdb-cache.csv
      CISA_KEV_PATH: ${VULNIX_HOST_DATA_DIR:-/opt/vulnix}/cache/cisa-kev-cache.json
    volumes:
      # Bind-mount (not named volume): path must match host for Kali scanner mounts
      - ${VULNIX_HOST_DATA_DIR:-/opt/vulnix}:${VULNIX_HOST_DATA_DIR:-/opt/vulnix}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_ORIGIN: ${REACT_APP_API_ORIGIN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
