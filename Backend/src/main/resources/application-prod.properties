# ═══════════════════════════════════════════════════════════════════════
# Profil PRODUCTION — activer avec :
#   SPRING_PROFILES_ACTIVE=prod
# Toutes les valeurs sensibles viennent des variables d'environnement.
# ═══════════════════════════════════════════════════════════════════════

spring.application.name=vulnix

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/medianet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — pas de show-sql, ddl contrôlé
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Première mise en prod : update. Ensuite préférer validate + migrations SQL.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Serveur
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# CORS (domaine(s) du frontend, séparés par des virgules)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost}

# Scanner / chemins Linux
vulnix.results.base-dir=${VULNIX_RESULTS_BASE_DIR:/data/scan-results}
vulnix.docker.image=${VULNIX_DOCKER_IMAGE:medianet-kali-scanner:v3}
vulnix.dc.cache.dir=${VULNIX_DC_CACHE_DIR:/data/vulnix-dc-cache}

# Caches locaux
exploitdb.csv.local-path=${EXPLOITDB_CSV_PATH:/data/cache/exploitdb-cache.csv}
cisa.kev.local-path=${CISA_KEV_PATH:/data/cache/cisa-kev-cache.json}

# APIs externes
nvd.api.key=${NVD_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}
gemini.chat.api.key=${GEMINI_CHAT_API_KEY:}
gemini.chat.api.url=${GEMINI_CHAT_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}
censys.api.key=${CENSYS_API_KEY:}
censys.api.id=${CENSYS_API_ID:}
censys.api.secret=${CENSYS_API_SECRET:}

# OAuth — URLs publiques HTTPS
github.client.id=${GITHUB_CLIENT_ID:}
github.client.secret=${GITHUB_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:https://api.example.com/api/auth/github/callback}
github.oauth.frontend-url=${GITHUB_OAUTH_FRONTEND_URL:https://app.example.com}

gitlab.client.id=${GITLAB_CLIENT_ID:}
gitlab.client.secret=${GITLAB_CLIENT_SECRET:}
gitlab.oauth.redirect-uri=${GITLAB_OAUTH_REDIRECT_URI:https://api.example.com/api/auth/gitlab/callback}

# Sécurité
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
token.encryption.key=${TOKEN_ENCRYPTION_KEY:}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.auth.login-rate-limit-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:10}
app.auth.require-strong-jwt-secret=true

# Bootstrap admin désactivé en prod (créer l'admin manuellement)
app.first-user-is-admin=${APP_FIRST_USER_IS_ADMIN:false}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.login=${APP_BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Admin}

# SSL Labs / traduction
ssllabs.enabled=${SSLLABS_ENABLED:true}
ssllabs.email=${SSLLABS_EMAIL:}
ssllabs.firstName=${SSLLABS_FIRST_NAME:Vulnix}
ssllabs.lastName=${SSLLABS_LAST_NAME:Prod}
ssllabs.organization=${SSLLABS_ORGANIZATION:Vulnix}
translation.enabled=${TRANSLATION_ENABLED:true}
translation.email=${TRANSLATION_EMAIL:}

# Logging
logging.level.root=INFO
logging.level.com.medianet=INFO
logging.level.org.hibernate.SQL=WARN
