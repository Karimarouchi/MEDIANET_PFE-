# Vulnix CI — Woodpecker (serveur + agent). Même fichier en local et sur le serveur :
# seules les valeurs du fichier .env changent.
#
#   docker compose up -d        démarrer
#   docker compose logs -f      suivre
#   docker compose down         arrêter (les données restent dans ./data)

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.18.1
    restart: unless-stopped
    ports:
      # Interface web. En local : 127.0.0.1 seulement. Sur le serveur : derrière nginx (voir README).
      - "${WOODPECKER_BIND:-127.0.0.1}:${WOODPECKER_PORT:-8000}:8000"
    volumes:
      - ./data:/var/lib/woodpecker
    environment:
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET}
      # Adresse publique que GitHub appelle à chaque push (GitHub refuse localhost).
      WOODPECKER_EXPERT_WEBHOOK_HOST: ${WOODPECKER_WEBHOOK_HOST}
      # Vulnix fournit les pipelines : Woodpecker doit pouvoir l'appeler (réseau privé ou Internet).
      WOODPECKER_EXTENSIONS_ALLOWED_HOSTS: ${WOODPECKER_EXTENSIONS_ALLOWED_HOSTS:-external,private}
    extra_hosts:
      # Sur un serveur Linux, host.docker.internal n'existe pas sans cette ligne (Docker Desktop l'a déjà).
      - "host.docker.internal:host-gateway"
    networks: [default, vulnix-net]

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.18.1
    restart: unless-stopped
    command: agent
    depends_on:
      - woodpecker-server
    volumes:
      - ./agent-config:/etc/woodpecker
      # L'agent lance chaque étape du pipeline dans un conteneur Docker de cette machine.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_MAX_WORKFLOWS: ${WOODPECKER_MAX_WORKFLOWS:-2}

  # Surveillance permanente des sites en production (alerte si un site ou son certificat tombe).
  # Données dans ./uptime-kuma (à sauvegarder avec ./data). Interface : http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    ports:
      - "${UPTIME_BIND:-127.0.0.1}:${UPTIME_PORT:-3001}:3001"
    volumes:
      - ./uptime-kuma:/app/data
    networks: [default, vulnix-net]

networks:
  # Réseau partagé avec le backend Vulnix (créé par le docker-compose de Vulnix, ou à la main :
  # docker network create vulnix-net). Le backend joint ainsi http://woodpecker-server:8000 et http://uptime-kuma:3001.
  vulnix-net:
    external: true
