# Vulnix quality gate — GitLab CI
# Test pipeline : antigone-agency/pfe-mediannet
#
# Variables (Settings → CI/CD → Variables) :
#   VULNIX_CI_TOKEN  = vx_live_…   (Masked = oui, Protect variable = non pour tester toutes les branches)
#   VULNIX_URL       = https://pfe.karimaoruchi.autolifeservices.com   (optionnel)
#
# Dans Vulnix : lier https://gitlab.com/antigone-agency/pfe-mediannet
# puis créer un jeton CI pour CE dépôt (pas un jeton GitHub / autre app).
#
# Bloquer la merge : Settings → Merge requests → Merge checks
#   → Pipelines must succeed

stages:
  - gate

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

vulnix-quality-gate:
  stage: gate
  image: alpine:3.21
  timeout: 20 minutes
  interruptible: true
  resource_group: vulnix-gate-$CI_COMMIT_REF_SLUG
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail

      if [ -z "${VULNIX_CI_TOKEN:-}" ]; then
        echo "Variable VULNIX_CI_TOKEN absente."
        echo "GitLab → Settings → CI/CD → Variables → Add variable (Masked)."
        exit 1
      fi

      API="${VULNIX_URL:-https://pfe.karimaoruchi.autolifeservices.com}"
      API="${API%/}"
      SHA="${CI_COMMIT_SHA}"
      REF="${CI_COMMIT_REF_NAME:-}"
      GIT_REPO="${CI_PROJECT_PATH}"
      POLL_SECONDS=10
      MAX_ATTEMPTS=90

      echo "Vulnix gate (GitLab)"
      echo "  url     = ${API}"
      echo "  repo    = ${GIT_REPO}"
      echo "  sha     = ${SHA}"
      echo "  ref     = ${REF}"

      auth_curl() {
        curl -sS --fail-with-body --max-time 60 \
          -H "Authorization: Bearer ${VULNIX_CI_TOKEN}" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          "$@"
      }

      START_PAYLOAD=$(jq -nc --arg sha "$SHA" --arg ref "$REF" --arg repo "$GIT_REPO" \
        '{commitSha: $sha, ref: $ref, githubRepo: $repo}')

      echo "→ POST /api/ci/scans"
      START_JSON=$(auth_curl -X POST "${API}/api/ci/scans" -d "${START_PAYLOAD}") || {
        echo "Échec POST /api/ci/scans (401 = jeton invalide, 403 = jeton pas scoped à ce repo, 404 = URL GitLab non liée dans Vulnix)."
        exit 1
      }
      echo "${START_JSON}" | jq '{scanId, repoId, repoUrl, status, reused, commitSha}'

      SCAN_ID=$(echo "${START_JSON}" | jq -r '.scanId // empty')
      SCANNED_URL=$(echo "${START_JSON}" | jq -r '.repoUrl // empty' | tr '[:upper:]' '[:lower:]')
      EXPECTED_SLUG=$(echo "${GIT_REPO}" | tr '[:upper:]' '[:lower:]')
      if [ -z "${SCAN_ID}" ] || [ "${SCAN_ID}" = "null" ]; then
        echo "Réponse invalide : pas de scanId"
        echo "${START_JSON}" | jq . || echo "${START_JSON}"
        exit 1
      fi
      if [ -n "${SCANNED_URL}" ] && ! echo "${SCANNED_URL}" | grep -q "${EXPECTED_SLUG}"; then
        echo "Mauvais dépôt scanné: ${SCANNED_URL} (attendu ${GIT_REPO})"
        echo "Dans Vulnix : lier https://gitlab.com/${GIT_REPO} puis recréer le jeton CI."
        exit 1
      fi

      STATUS="RUNNING"
      for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
        SCAN_JSON=$(auth_curl "${API}/api/ci/scans/${SCAN_ID}")
        STATUS=$(echo "${SCAN_JSON}" | jq -r '.status // "UNKNOWN"')
        CVE_COUNT=$(echo "${SCAN_JSON}" | jq -r '.cveCount // 0')
        echo "  [${attempt}/${MAX_ATTEMPTS}] scan ${SCAN_ID} → ${STATUS} (${CVE_COUNT} CVE)"
        case "${STATUS}" in
          COMPLETED) break ;;
          FAILED)
            echo "Scan Kali en échec (fail-closed)."
            exit 1
            ;;
        esac
        sleep "${POLL_SECONDS}"
      done

      if [ "${STATUS}" != "COMPLETED" ]; then
        echo "Timeout ${MAX_ATTEMPTS}x${POLL_SECONDS}s : scan encore ${STATUS} (fail-closed)."
        exit 1
      fi

      echo "→ GET /api/ci/verdict"
      VERDICT_JSON=$(auth_curl "${API}/api/ci/verdict?sha=${SHA}&githubRepo=${GIT_REPO}")
      echo "${VERDICT_JSON}" | jq '{verdict, reason, scanId, repoId, reportUrl, blocking, ignored}'

      VERDICT=$(echo "${VERDICT_JSON}" | jq -r '.verdict // "FAIL"')
      REASON=$(echo "${VERDICT_JSON}" | jq -r '.reason // "UNKNOWN"')
      REPORT=$(echo "${VERDICT_JSON}" | jq -r '.reportUrl // empty')

      COMMENT=$(echo "${VERDICT_JSON}" | jq -r --arg sha "$SHA" '
        def rows:
          if (type == "array" and length > 0)
          then (["| CVE | Sévérité | Package |", "| --- | --- | --- |"]
                + [.[] | "| \(.cveId // "-") | \(.severity // "-") | `\(.packageName // "-")` |"])
                | join("\n")
          else "_Aucune._"
          end;
        "## Vulnix quality gate: **\(.verdict // "FAIL")**\n\n"
        + "- SHA: `\($sha)`\n"
        + "- Motif: `\(.reason // "UNKNOWN")`\n"
        + (if .reportUrl then "- Rapport: \(.reportUrl)\n" else "" end)
        + "\n### Bloquantes (CRITICAL / HIGH)\n\n"
        + ((.blocking // []) | rows)
        + "\n\n### Ignorées (risque accepté / dérogation chef)\n\n"
        + ((.ignored // []) | rows)
        + "\n\n_La merge est bloquée tant que le pipeline `vulnix-quality-gate` est rouge._\n"
      ')

      if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "→ Note merge request !${CI_MERGE_REQUEST_IID}"
        jq -nc --arg body "${COMMENT}" '{body: $body}' \
          | curl -sS --fail-with-body --max-time 30 \
              -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
              -d @- >/dev/null \
          || echo "Note MR non publiée (permissions GitLab)."
      fi

      echo "=========================================="
      echo "Verdict: ${VERDICT} (${REASON})"
      if [ -n "${REPORT}" ]; then
        echo "Rapport: ${REPORT}"
      fi
      echo "=========================================="

      if [ "${VERDICT}" != "PASS" ]; then
        echo "Quality gate rouge : merge à bloquer."
        exit 1
      fi

      echo "Quality gate vert : merge autorisée (si Pipelines must succeed)."
